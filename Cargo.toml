[workspace]
members = [
    ".",
    "crates/shared-types",
    "crates/dfir-evtx",
    "crates/recon-net",
]
resolver = "2"

[package]
name = "larp"
version = "0.1.0"
edition = "2021"
authors = ["Ventie"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
config = "0.14"
directories = "5.0"
shared-types = { path = "crates/shared-types" }
